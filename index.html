<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selling Out dan DOI</title>
<style>
  :root{--bg:#f5f6f3;--card:#fff;--fg:#17201c;--mut:#66736c;--line:#dfe4de;--acc:#0b6b5e;
    --low:#c63a47;--warn:#b5771a;--ok:#137a5a;--high:#2f6fb5;--idle:#7a857f}
  @media (prefers-color-scheme:dark){:root{--bg:#101512;--card:#18201c;--fg:#e8eee9;--mut:#93a39a;--line:#2a352f;--acc:#3fb59f;
    --low:#ef7a85;--warn:#e0a24a;--ok:#4cc79b;--high:#6fa8e8;--idle:#98a49d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  main{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{margin:0;font-size:1.5rem;line-height:1.15}
  h2{margin:0;font-size:1rem}
  .sub,.note,.foot{color:var(--mut);font-size:.82rem;margin:4px 0 0}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{font:inherit;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
  .seg button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:600}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .take{margin:0}
  .srch{font:inherit;width:100%;min-height:42px;margin-top:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);-webkit-appearance:none}
  .srch:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .po{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .po label{font-weight:600}
  .po input{font:inherit;width:6rem;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-variant-numeric:tabular-nums}
  .po input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  td.po-c{font-weight:700;color:var(--fg)}
  td.po-c.z{font-weight:400;color:var(--mut)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .tile .big{display:block;font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
  .tile .sm{display:block;color:var(--mut);font-size:.78rem;margin-top:2px}
  .lbl{color:var(--mut);font-size:.8rem}
  .s-low{--c:var(--low)} .s-warn{--c:var(--warn)} .s-ok{--c:var(--ok)} .s-high{--c:var(--high)} .s-idle{--c:var(--idle)}
  .tile[class*=s-] .big{color:var(--c)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;font-size:.78rem;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
  .chip b{font-variant-numeric:tabular-nums}
  .scroll{overflow:auto;max-height:36rem;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal;min-width:13rem}
  th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600}
  td.t{text-align:center}
  td.c{color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);font-weight:600}
  td.c small{display:block;font-weight:400;color:var(--mut);font-size:.72rem}
  .pill{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-size:.7rem}
  .err{color:var(--low)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Selling Out dan DOI</h1>
    <p class="sub" id="sub">Memuat data…</p>
  </header>
  <div class="seg" id="seg" role="group" aria-label="Pilih kota">
    <button type="button" data-k="Manado" aria-pressed="true">Manado</button>
    <button type="button" data-k="Makassar" aria-pressed="false">Makassar</button>
    <button type="button" data-k="Kendari" aria-pressed="false">Kendari</button>
    <button type="button" data-k="Gorontalo" aria-pressed="false">Gorontalo</button>
  </div>
  <div class="po">
    <label for="tdoi">Suggest PO untuk DOI</label>
    <input type="number" id="tdoi" inputmode="numeric" min="1" max="365" step="1" value="30">
    <span>hari</span>
  </div>
  <p class="take" id="take"></p>
  <div class="tiles">
    <div class="card tile"><span class="lbl">Stock</span><span class="big" id="ts">-</span><span class="sm" id="tsd"></span></div>
    <div class="card tile"><span class="lbl">Avg selling out per bulan</span><span class="big" id="ta">-</span><span class="sm" id="tad"></span></div>
    <div class="card tile"><span class="lbl">Suggest PO</span><span class="big" id="tp">-</span><span class="sm" id="tpd"></span></div>
    <div class="card tile" id="tdc"><span class="lbl">DOI</span><span class="big" id="td">-</span><span class="sm" id="tds">Stock ÷ Avg × 30 hari</span></div>
  </div>
  <section class="card">
    <h2>Item summary</h2>
    <p class="note" id="legend"></p>
    <div class="chips" id="chips"></div>
    <input type="search" id="q" class="srch" placeholder="Cari nama item…" autocomplete="off" enterkeyhint="search" aria-label="Cari item">
    <p class="note" id="qn"></p>
    <div class="scroll"><table>
      <thead><tr><th>Item</th><th>Tipe</th><th>Sat</th><th>Stock</th><th>Avg / bln</th><th>DOI</th><th>Suggest PO</th><th id="m1"></th><th id="m2"></th><th id="m3"></th><th>Avg Rp / bln</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <p class="foot" id="foot"></p>
</main>
<script>
// Ambang DOI (hari): di bawah LOW = kurang, sampai WARN = waspada, sampai HIGH = aman, di atasnya = berlebih.
const T={low:15,warn:30,high:60};
const NAME={low:'Kurang',warn:'Waspada',ok:'Aman',high:'Berlebih',idle:'Tanpa penjualan'};
const DB='https://firestore.googleapis.com/v1/projects/mds-sulawesi/databases/(default)/documents/pjmds_data';
const KEY='AIzaSyCA8Q8athqYIsY3By5wPxcU97GjDBR6DAs';
const BLN=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const KOTA=[[/GORONTALO/,'Gorontalo'],[/MAKASS?AR/,'Makassar'],[/MANADO/,'Manado'],[/KENDARI/,'Kendari']];
const kotaOf=c=>{c=c.toUpperCase();for(const [re,k] of KOTA)if(re.test(c))return k;return null};
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const n1=new Intl.NumberFormat('id-ID',{maximumFractionDigits:1});
// Satuan: HILO tetap PCS; lainnya CTN. 1 CTN = 720 pcs untuk NutriSari American Sweet Orange, Florida Orange, Jeruk Peras; selain itu 160 pcs.
const unitOf=n=>/^HILO\b/i.test(n)?{u:'PCS',div:1}:/AMRCN SWT ORANG|FLORIDA ORANGE|JERUK PERAS/i.test(n)?{u:'CTN',div:720}:{u:'CTN',div:160};
let target=30;
try{const v=+localStorage.getItem('targetDoi');if(v>=1&&v<=365)target=Math.round(v)}catch(e){}
const poOf=(avg,stock)=>avg>0?Math.max(0,Math.ceil(avg*target/30-stock-1e-9)):0;
// urutan tampil: NutriSari dulu, lalu HILO, lalu lainnya; di dalam kelompok dari nilai rupiah terbesar
const grp=n=>/^NUTRISARI\b/i.test(n)?0:/^HILO\b/i.test(n)?1:2;
const fq=(v,u)=>(u==='CTN'?n1:nf).format(v);
const cf=new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:1});
const dlbl=d=>+d.slice(8)+' '+BLN[+d.slice(5,7)]+' '+d.slice(0,4);
const wita=iso=>new Date(iso).toLocaleString('id-ID',{timeZone:'Asia/Makassar',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(/\./g,':')+' WITA';
const status=(stock,avg)=>{if(avg<=0)return stock>0?'idle':null;const d=stock/avg*30;return d<T.low?'low':d<T.warn?'warn':d<=T.high?'ok':'high'};
const doi=(stock,avg)=>avg>0?stock/avg*30:null;
const fdoi=d=>d==null?'∞':nf.format(d)+' hari';
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
async function get(p){const r=await fetch(DB+'/'+p+'?key='+KEY);if(r.status===404)return null;if(!r.ok)throw new Error('Database tidak bisa dibaca ('+r.status+')');return r.json()}
const field=(d,f)=>d&&d.fields&&d.fields[f]?d.fields[f].stringValue:null;

let D=null,kota='Manado';
async function load(){
  const [sm,tm]=await Promise.all([get('so_meta'),get('stok_meta')]);
  const months=Object.keys(JSON.parse(field(sm,'months')||'{}')).sort().slice(-3);
  const metaSo=JSON.parse(field(sm,'months')||'{}'),metaSt=JSON.parse(field(tm,'snaps')||'{}');
  const snaps=Object.keys(metaSt).sort().slice(-2);
  if(!months.length)throw new Error('Belum ada data selling out. Import dulu lewat halaman import.');
  const [so,st]=await Promise.all([Promise.all(months.map(m=>get('so_'+m))),Promise.all(snaps.map(s=>get('stok_'+s)))]);
  const items=new Map();
  const slot=(kode,name)=>{const t=(name.match(/\b(RCG|SCT)\b/)||[])[1];if(!t)return null;const key=kode+'|'+name;let o=items.get(key);
    if(!o){o={n:name,t,kode,s:{},p:{},d:{}};items.set(key,o)}return o};
  so.forEach((d,mi)=>JSON.parse(field(d,'data')).forEach(([cab,kode,name,q,r])=>{
    const k=kotaOf(cab);if(!k)return;const o=slot(kode,name);if(!o)return;
    const x=o.d[k]||(o.d[k]=[0,0,0,0,0,0]);x[mi]+=q;x[3+mi]+=r;
  }));
  // stok dicocokkan lewat kode item
  const byCode=new Map();items.forEach(o=>{if(!byCode.has(o.kode))byCode.set(o.kode,o)});
  st.forEach((d,si)=>JSON.parse(field(d,'data')).forEach(([cab,kode,name,q])=>{
    const k=kotaOf(cab);if(!k)return;const o=byCode.get(kode)||slot(kode,name);if(!o)return;
    const tgt=si===st.length-1?o.s:o.p;tgt[k]=(tgt[k]||0)+q;
  }));
  const ats=[...months.map(m=>metaSo[m].at),...snaps.map(s=>metaSt[s].at)];
  D={months,items:[...items.values()],stokDate:snaps[snaps.length-1]||null,prevDate:snaps.length>1?snaps[0]:null,
     lastSo:Object.values(metaSo).map(x=>x.at).sort().pop(),lastSt:Object.values(metaSt).map(x=>x.at).sort().pop()};
}
function rowsOf(k){
  const n=D.months.length;
  return D.items.map(o=>{
    const {u,div}=unitOf(o.n),d=o.d[k]||[0,0,0,0,0,0],avg=(d[0]+d[1]+d[2])/n/div,stock=(o.s[k]||0)/div,prev=D.prevDate?(o.p[k]||0)/div:null;
    return{n:o.n,t:o.t,u,q:d.slice(0,3).map(v=>v/div),avg,ar:(d[3]+d[4]+d[5])/n,stock,doi:doi(stock,avg),po:poOf(avg,stock),prev:prev==null?null:doi(prev,avg),st:status(stock,avg)};
  }).filter(r=>r.st).sort((a,b)=>grp(a.n)-grp(b.n)||b.ar-a.ar||b.stock-a.stock);
}
function render(){
  if(!D)return;
  const r=rowsOf(kota),c=r.filter(x=>x.u==='CTN'),h=r.filter(x=>x.u==='PCS');
  const sum=(a,f)=>a.reduce((s,x)=>s+x[f],0);
  const stock=sum(c,'stock'),avg=sum(c,'avg'),tot=doi(stock,avg),ts=status(stock,avg);
  const hs=sum(h,'stock'),ha=sum(h,'avg'),hd=doi(hs,ha),pc=sum(c,'po'),ph=sum(h,'po');
  $('sub').textContent='Item RCG dan SCT · avg '+D.months.map(m=>BLN[+m.slice(5)]).join(', ')+' '+D.months[D.months.length-1].slice(0,4)+' · stok per '+(D.stokDate?dlbl(D.stokDate):'-')+' · Indogrosir + SPI';
  const top=r[0];
  $('take').replaceChildren(el('b',null,kota),document.createTextNode(' paling laku '),el('b',null,top?top.n:'-'),document.createTextNode(' (nilai rupiah), DOI item CTN '+fdoi(tot)+'.'));
  $('ts').textContent=n1.format(stock);$('tsd').textContent='CTN, update '+(D.stokDate?dlbl(D.stokDate):'-')+(h.length?' · HILO '+nf.format(hs)+' pcs':'');
  $('ta').textContent=n1.format(avg);$('tad').textContent='CTN per bulan, '+D.months.length+' bulan terakhir'+(h.length?' · HILO '+nf.format(ha)+' pcs':'');
  $('tp').textContent=nf.format(pc);$('tpd').textContent='CTN agar DOI '+target+' hari'+(h.length?' · HILO '+nf.format(ph)+' pcs':'');
  $('td').textContent=fdoi(tot);$('tds').textContent='Stock ÷ Avg × 30 hari'+(h.length?' · HILO '+fdoi(hd):'');$('tdc').className='card tile '+(ts?'s-'+ts:'');
  D.months.forEach((m,i)=>$('m'+(i+1)).textContent=BLN[+m.slice(5)]);
  $('legend').textContent='Suggest PO = Avg × DOI target ÷ 30 − Stock, dibulatkan ke atas per satuan (CTN, HILO pcs). Belum memperhitungkan barang dalam perjalanan atau PO yang sudah jalan. Warna mengikuti DOI: kurang < '+T.low+' hari, waspada '+T.low+' sampai '+T.warn+', aman '+T.warn+' sampai '+T.high+', berlebih > '+T.high+' hari. Item tanpa penjualan tapi masih ada stok ditandai abu-abu.';
  const qs=$('q').value.trim().toLowerCase(),rr=qs?r.filter(x=>x.n.toLowerCase().includes(qs)):r;
  $('qn').textContent=qs?rr.length+' dari '+r.length+' item cocok dengan "'+$('q').value.trim()+'"':'';
  const cnt={};rr.forEach(x=>cnt[x.st]=(cnt[x.st]||0)+1);
  $('chips').replaceChildren(...['low','warn','ok','high','idle'].filter(s=>cnt[s]).map(s=>{const c=el('span','chip s-'+s);c.append(NAME[s]+' ',el('b',null,cnt[s]));return c}));
  $('rows').replaceChildren(...rr.map(x=>{
    const poCell=x=>el('td','po-c'+(x.po?'':' z'),x.po?nf.format(x.po):'-');
    const tr=el('tr'),tp=el('td','t'),cell=(txt,sub)=>{const td=el('td','c s-'+x.st,txt);if(sub){td.append(el('small',null,sub))}return td};
    tp.append(el('span','pill',x.t));const su=el('td','t');su.append(el('span','pill',x.u));
    const sub=x.prev==null?null:'sebelumnya '+fdoi(x.prev);
    tr.append(el('td',null,x.n),tp,su,cell(fq(x.stock,x.u)),cell(fq(x.avg,x.u)),cell(fdoi(x.doi),sub),poCell(x),...x.q.map(v=>el('td',null,fq(v,x.u))),el('td',null,'Rp '+nf.format(x.ar)));
    return tr;
  }));
  $('foot').textContent='Terakhir upload: selling out '+(D.lastSo?wita(D.lastSo):'-')+' · stok '+(D.lastSt?wita(D.lastSt):'-')+'. Sumber: laporan Selling Out PD dan Stock Baik (Indogrosir dan SPI). Satuan: semua CTN kecuali HILO (PCS). 1 CTN = 720 pcs untuk NutriSari American Sweet Orange, Florida Orange, dan Jeruk Peras, selain itu 160 pcs. Avg dibagi jumlah bulan, termasuk bulan tanpa penjualan. Cabang SPI bertambah sepanjang 2026, jadi bulan awal tidak sepenuhnya setara.';
}
$('q').addEventListener('input',render);
$('tdoi').value=target;
$('tdoi').addEventListener('input',e=>{const v=Math.round(+e.target.value);if(!(v>=1&&v<=365))return;target=v;try{localStorage.setItem('targetDoi',String(v))}catch(x){}render()});
$('seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;kota=b.dataset.k;
  document.querySelectorAll('#seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();
});
load().then(render).catch(e=>{$('sub').textContent='';$('take').className='err';$('take').textContent=e.message});
</script>
</body>
</html>
