<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Baru</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f5; --fg: #1b2420; --muted: #66736c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121815; --fg: #e8eeea; --muted: #8fa097; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Halaman Baru</h1>
  <p>Masih kosong.</p>
</main>
</body>
</html>
